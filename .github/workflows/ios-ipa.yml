# يبني ملف IPA غير موقّع للآيفون على جهاز macOS في GitHub Actions.
# الملف الناتج يظهر في صفحة التشغيل تحت Artifacts باسم Maydan-unsigned-ipa،
# على main يُنشر كإصدار (Release) باسم رقم الإصدار ورقم البناء، مع ملاحظات من app/changelog.json.
# يحتاج توقيعًا بشهادتك قبل التثبيت.
name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, claude/serene-gates-qruhbg]
    paths:
      - 'app/**'
      - '.github/workflows/ios-ipa.yml'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Logic tests
        run: npx jest

      - name: Stamp version and build number
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json"));
            const latest = require("./changelog.json")[0];
            if (app.expo.version !== latest.version) throw new Error("app.json version " + app.expo.version + " != changelog " + latest.version);
            app.expo.ios = { ...app.expo.ios, buildNumber: process.env.GITHUB_RUN_NUMBER };
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            fs.appendFileSync(process.env.GITHUB_ENV, "APP_VERSION=" + latest.version + "\nEXPO_PUBLIC_BUILD_NUMBER=" + process.env.GITHUB_RUN_NUMBER + "\n");
          '

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build archive (no code signing)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Maydan.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200
          test -d "$RUNNER_TEMP/Maydan.xcarchive/Products/Applications"

      - name: Package IPA
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R Maydan.xcarchive/Products/Applications/*.app Payload/
          zip -qry Maydan-unsigned.ipa Payload
          ls -lh Maydan-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/*.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Payload/*.app/Info.plist || true

      - uses: actions/upload-artifact@v4
        with:
          name: Maydan-unsigned-ipa
          path: ${{ runner.temp }}/Maydan-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Write release notes
        if: github.ref == 'refs/heads/main'
        run: |
          node -e '
            const latest = require("./changelog.json")[0];
            const lines = [
              "## " + latest.title,
              "",
              ...latest.changes.map((c) => "- " + c),
              "",
              "---",
              "الإصدار " + latest.version + " · بناء " + process.env.GITHUB_RUN_NUMBER + " · " + latest.date,
              "",
              "ملف IPA غير موقّع: وقّعه بشهادتك وملف التعريف قبل التثبيت (مثلًا Sideloadly أو ESign).",
              "معرّف الحزمة: `com.maydan.fieldsafety`. التطبيق لا يطلب صلاحيات خاصة.",
              "سجل كل التحديثات داخل التطبيق: الإعدادات ← سجل التحديثات.",
            ];
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/notes.md", lines.join("\n"));
          '

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ميدان ${{ env.APP_VERSION }} · بناء ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: ${{ runner.temp }}/Maydan-unsigned.ipa
          body_path: ${{ runner.temp }}/notes.md
