# يبني ملف IPA غير موقّع للآيفون على جهاز macOS في GitHub Actions.
# الملف الناتج يظهر في صفحة التشغيل تحت Artifacts باسم Maydan-unsigned-ipa،
# ويحتاج توقيعًا بشهادتك قبل التثبيت.
name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, claude/serene-gates-qruhbg]
    paths:
      - 'app/**'
      - '.github/workflows/ios-ipa.yml'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Logic tests
        run: npx jest

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build archive (no code signing)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Maydan.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200
          test -d "$RUNNER_TEMP/Maydan.xcarchive/Products/Applications"

      - name: Package IPA
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R Maydan.xcarchive/Products/Applications/*.app Payload/
          zip -qry Maydan-unsigned.ipa Payload
          ls -lh Maydan-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/*.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Payload/*.app/Info.plist || true

      - uses: actions/upload-artifact@v4
        with:
          name: Maydan-unsigned-ipa
          path: ${{ runner.temp }}/Maydan-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
